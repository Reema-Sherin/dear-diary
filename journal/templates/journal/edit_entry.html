
{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Memory | Dear Diary</title>
    <link rel="stylesheet" href="{% static 'journal/style.css' %}">
</head>

<body class="edit-page">

    <div class="edit-container">

        <h1>Edit Your Memory ♡</h1>
        <p class="edit-subtitle">
            Some memories deserve a little editing...
        </p>

        {% if error %}
            <p class="edit-error">{{ error }}</p>
        {% endif %}

        <form method="POST" class="edit-form" enctype=""multipart/form-data">
            {% csrf_token %}

            <label for="title">Memory Title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ entry.title }}"
                required
            >

            <label for="content">Your Thoughts</label>
            <textarea
                id="content"
                name="content"
                rows="12"
                required
            >{{ entry.content }}</textarea>

            <div class="image-upload">

                <label for="id_image">
                    Change your photograph ♡
                </label>

                {% if entry.image %}
                    <p>Current photograph:</p>

                    <img
                        src="{{ entry.image.url }}"
                        alt="Current memory photograph"
                        style="max-width: 200px; border-radius: 12px;"
                    >

                    <label>
                        <input type="checkbox" name="remove_image">
                        Remove this photograph
                    </label>
                {% endif %}

                <input
                    type="file"
                    name="image"
                    id="id_image"
                    accept="image/*"
                >

            </div>

            <label for="mood">How are you feeling? ♡</label>

            <select name="mood" id="mood" class="mood-select">
                <option value="">Choose a mood (optional)</option>

                {% for value, label in entry.MOOD_CHOICES %}
                    <option value="{{ value }}"
                        {% if entry.mood == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                {% endfor %}
            </select>


            <button type="submit">Save Changes ♡</button>
        </form>

        <a href="{% url 'entry_detail' entry.id %}" class="edit-cancel">
            ← Back to Memory
        </a>

    </div>

</body>
</html>
